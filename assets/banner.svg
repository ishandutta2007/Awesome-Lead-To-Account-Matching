<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes pulseNode {
        0%, 100% { r: 6px; opacity: 0.5; }
        50% { r: 10px; opacity: 1; }
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badgeSlide {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .circuit-line {
        stroke: #38bdf8;
        stroke-opacity: 0.25;
        stroke-dasharray: 8 12;
        animation: beamMove 25s linear infinite;
      }
      .pulsing-dot {
        animation: pulseNode 3.5s ease-in-out infinite;
      }
      .badge-float {
        animation: badgeSlide 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="338" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Dynamic / Animated Flow Connectors in Background -->
  <g class="circuit-line" fill="none" stroke-width="2">
    <path d="M 60,80 C 220,40 340,160 500,90 C 680,20 820,120 1140,70" />
    <path d="M 100,280 C 300,240 450,300 700,260 C 900,220 1020,300 1120,250" />
    <path d="M 180,310 C 260,180 400,210 580,270 C 800,320 980,180 1080,140" />
  </g>

  <!-- Animated Glowing Network Nodes -->
  <circle cx="220" cy="60" r="7" fill="#38bdf8" class="pulsing-dot" filter="url(#glow)" />
  <circle cx="500" cy="90" r="8" fill="#818cf8" class="pulsing-dot" filter="url(#glow)" style="animation-delay: 1.2s;" />
  <circle cx="700" cy="260" r="7" fill="#c084fc" class="pulsing-dot" filter="url(#glow)" style="animation-delay: 2.1s;" />
  <circle cx="1080" cy="140" r="8" fill="#38bdf8" class="pulsing-dot" filter="url(#glow)" style="animation-delay: 0.7s;" />
  <circle cx="1140" cy="70" r="6" fill="#34d399" class="pulsing-dot" filter="url(#glow)" style="animation-delay: 1.8s;" />

  <!-- Lead to Account Flow Visual Elements (Subtle Decorative Cards in lower right) -->
  <g class="badge-float" opacity="0.85">
    <!-- Lead Pill -->
    <rect x="910" y="215" width="90" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="955" y="236" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">👤 Lead</text>
    
    <!-- Connector Arrow -->
    <path d="M 1005,231 L 1025,231" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)" />
    
    <!-- Account Pill -->
    <rect x="1030" y="215" width="115" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text x="1087" y="236" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🏢 Account</text>
  </g>

  <!-- Foreground Title and Subtitle Content (Always On Top) -->
  <g id="foreground-content">
    <!-- Category Tag Badge -->
    <rect x="80" y="42" width="260" height="28" rx="14" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="1.2" />
    <circle cx="95" cy="56" r="4.5" fill="#10b981" />
    <text x="110" y="61" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">REVOPS &amp; B2B CRM INTELLIGENCE</text>

    <!-- Main Title -->
    <text x="80" y="125" fill="url(#primaryText)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Awesome Lead-to-Account Matching</text>

    <!-- Subtitle / Tagline -->
    <text x="80" y="168" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500">
      The Curated Directory of SaaS Solutions, Open-Source Tools &amp; Fuzzy Matching Engines
    </text>

    <!-- Value propositions / keywords -->
    <text x="80" y="202" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">
      🎯 Automated Routing &nbsp;•&nbsp; 🧩 Fuzzy Entity Resolution &nbsp;•&nbsp; 📈 Account-Based Marketing (ABM) &nbsp;•&nbsp; 🛡️ Data Quality
    </text>

    <!-- Pill Stats/Highlight Box -->
    <g transform="translate(80, 235)">
      <rect width="170" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Enterprise SaaS</text>
      <text x="125" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">10+ Leaders</text>

      <rect x="185" width="185" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="201" y="26" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Open-Source</text>
      <text x="290" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">15+ Engines</text>

      <rect x="385" width="185" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="401" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Fuzzy Matching</text>
      <text x="510" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Probabilistic</text>
    </g>
  </g>
</svg>
